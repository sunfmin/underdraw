[package]
name = "underdraw"
description = "Describe a screen once; check it, render it, hand it off to web, iOS and Android — a CLI for AI agents"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
underdraw-format = { path = "../format" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
vello = "0.11.0"
parley = { version = "0.12.0", features = ["complex-scripts"] }
png = "0.18.1"
pollster = "1.0.1"
underdraw-layout = { version = "0.1.0", path = "../layout" }
underdraw-handoff = { path = "../handoff" }
underdraw-compare = { path = "../compare" }
