[package]
name = "underdraw-layout"
description = "Lays out a screen in one state as a wireframe: boxes, text and labels to draw. Pure; checked by Flux."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
underdraw-format = { path = "../format" }
taffy = "0.15.0"
serde.workspace = true
serde_json.workspace = true
flux-rs.workspace = true
flux-alloc.workspace = true
flux-core.workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

# `cargo flux` (through ../../verify.sh) checks every function in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
