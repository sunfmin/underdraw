[package]
name = "underdraw-format"
description = "The screen description format: reads one and names every fault. Pure; checked by Flux."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Refinement attributes; they expand to nothing under a plain `cargo build`.
flux-rs = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
# Flux's refinements of the standard library, at the same revision: without
# them a `Vec` has no length Flux knows of. Both are empty under a plain build.
flux-alloc = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
flux-core = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

# `cargo flux` (through ../../verify.sh) checks every function in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

# The checker ../../verify.sh runs, beside the Flux revision above. It refuses
# any other: each value is what the tool reports about itself.
[package.metadata.checker]
fixpoint = "0.9.6.3.8 (684d0829c19fbee83b892c9f5e20c2598897297c)"
z3 = "5.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
