[package]
name = "underdraw-compare"
description = "What differs between a running UI's elements and what the description says one state shows. Pure; checked by Flux."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
underdraw-format = { path = "../format" }
underdraw-handoff = { path = "../handoff" }
underdraw-layout = { path = "../layout" }
serde.workspace = true
serde_json.workspace = true
flux-rs.workspace = true
flux-alloc.workspace = true
flux-core.workspace = true

# `cargo flux` (through ../../verify.sh) checks every function in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
